{% extends "base.html" %}

{% block content %}
{% if page.extra.image %}
<div class="blog-image-wrap">
	<a href="{{ page.permalink | safe}}"><img src="{{ page.extra.image | safe}}" alt="{{ page.title }}" class="blog-thumbnail"></a>
</div>
{% endif %}
<h1 class="title">
	{{ page.title }}
</h1>
<p class="subtitle"><strong>{{ page.date }}</strong></p>
<div class="blog-content">
{{ page.content | safe }}
</div>
{% endblock content %}
